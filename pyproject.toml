[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-dev-cli"
version = "0.1.0"
description = "CLI wrapper for delegating coding tasks to OpenCode, Codex, and Claude Code."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
crewai = ["crewai"]

[project.scripts]
madcli = "madcli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["madcli*"]
